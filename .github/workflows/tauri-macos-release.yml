name: tauri-macos-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch_label: apple-silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch_label: intel
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download kanata binaries
        env:
          KANATA_VERSION: "1.10.1"
        run: |
          mkdir -p bin
          curl -sL "https://github.com/jtroo/kanata/releases/download/v${KANATA_VERSION}/kanata-macos-binaries-arm64-v${KANATA_VERSION}.zip" -o /tmp/kanata-arm64.zip
          curl -sL "https://github.com/jtroo/kanata/releases/download/v${KANATA_VERSION}/kanata-macos-binaries-x64-v${KANATA_VERSION}.zip" -o /tmp/kanata-x64.zip
          unzip -j /tmp/kanata-arm64.zip kanata_macos_arm64 -d bin/
          unzip -j /tmp/kanata-x64.zip kanata_macos_x64 -d bin/
          chmod +x bin/kanata_macos_arm64 bin/kanata_macos_x64

      - name: Import Apple Developer certificate
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Sign kanata binaries
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            bin/kanata_macos_arm64 bin/kanata_macos_x64

      - name: Build, sign, notarize, and draft release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mantle ${{ github.ref_name }}"
          releaseBody: "Automated signed/notarized macOS Tauri release (Apple Silicon + Intel)."
          releaseDraft: false
          prerelease: false
          args: "--target ${{ matrix.target }}"
